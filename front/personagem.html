<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escolha seu personagem | Grey's Universe</title>

    <!-- FONTES DO GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- MENU -->
    <div class="menu">
        <a href="index.html" class="logo">
            <svg class="logo-icone" viewBox="0 0 64 56">
                <circle cx="10" cy="5" r="2" />
                <circle cx="26" cy="5" r="2" />
                <path d="M10 7 C10 18 12 23 18 23 C24 23 26 18 26 7" />
                <path d="M18 23 V32 Q18 42 27 42 H32 L35 36 L39 50 L43 30 L47 42 H51" />
                <circle cx="56" cy="42" r="4.5" />
            </svg>
            Grey's Universe
        </a>
        <div class="menu-links">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="curiosidades.html">Curiosidades</a>
            <a href="index.html#musicas">Músicas</a>
            <a href="frases.html">Frases</a>
            <a href="quiz.html">Quiz</a>
            <a href="login.html" class="botao-entrar">Entrar</a>
        </div>
    </div>

    <!-- ESCOLHA DE PERSONAGEM -->
    <div class="secao pagina-personagem">
        <h2 id="titulo_boas_vindas">Escolha seu personagem</h2>
        <p>Qual personagem de Grey's Anatomy combina mais com você?</p>

        <div class="mensagem" id="div_exibir"></div>

        <!-- os cartões são montados aqui pelo JavaScript -->
        <div class="cartoes" id="div_personagens"></div>
    </div>

    <script>
        // se ninguém estiver logado, volta para o login
        if (sessionStorage.ID_USUARIO == null) {
            window.location = "login.html";
        }

        titulo_boas_vindas.innerHTML = "Olá, " + sessionStorage.NOME_USUARIO + "! Escolha seu personagem";

        listarPersonagens();

        // BUSCA OS PERSONAGENS NA API E MONTA OS CARTÕES
        function listarPersonagens() {
            fetch("/personagens/listar")
                .then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (personagens) {
                            let cartoes = "";

                            for (let i = 0; i < personagens.length; i++) {
                                let classeExtra = "";
                                if (sessionStorage.PERSONAGEM_USUARIO == personagens[i].idPersonagem) {
                                    classeExtra = " escolhido";
                                }

                                cartoes += `
                                    <div class="cartao-personagem${classeExtra}">
                                        <img src="assets/imgs/${personagens[i].imagem}" alt="${personagens[i].nome}">
                                        <h3>${personagens[i].nome}</h3>
                                        <p>${personagens[i].descricao}</p>
                                        <button class="botao-escolher" onclick="escolher(${personagens[i].idPersonagem})">Escolher</button>
                                    </div>
                                `;
                            }

                            div_personagens.innerHTML = cartoes;
                        });
                    } else {
                        div_exibir.innerHTML = "Não foi possível carregar os personagens.";
                    }
                })
                .catch(function (erro) {
                    console.log(erro);
                    div_exibir.innerHTML = "Erro de conexão com o servidor.";
                });
        }

        // SALVA O PERSONAGEM ESCOLHIDO
        function escolher(idPersonagem) {
            let dadosEscolha = {
                idUsuarioServer: sessionStorage.ID_USUARIO,
                idPersonagemServer: idPersonagem
            };

            fetch("/usuarios/atualizarPersonagem", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dadosEscolha)
            }).then(function (resposta) {
                if (resposta.ok) {
                    sessionStorage.PERSONAGEM_USUARIO = idPersonagem;
                    div_exibir.innerHTML = "Personagem escolhido! Indo para o quiz...";
                    setTimeout(function () {
                        window.location = "quiz.html";
                    }, 1500);
                } else {
                    div_exibir.innerHTML = "Não foi possível salvar sua escolha.";
                }
            }).catch(function (erro) {
                console.log(erro);
                div_exibir.innerHTML = "Erro de conexão com o servidor.";
            });
        }
    </script>

</body>

</html>
