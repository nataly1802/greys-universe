<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grey's Universe</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="menu">
        <a href="index.html" class="logo">
            <svg class="logo-icone" viewBox="0 0 64 72"><path d="M32 1 V11"/><path d="M28 12 Q32 8.5 36 12"/><path d="M16 15 Q32 10.5 48 15 Q32 19.5 16 15 Z"/><path d="M19 15 H45"/><path d="M23 18.2 L27.5 22 H36.5 L41 18.2"/><path d="M27.5 22 Q31 36 29.5 44 L24 64"/><path d="M36.5 22 Q33 36 34.5 44 L40 64"/><path d="M32 22 V64"/><path d="M28.6 42.5 Q32 44 35.4 42.5"/><path d="M2 64 H9 L11.5 58.5 L14.5 69 L17 64 H47 L49.5 60 L52 66 L54 64 H62"/></svg>
            Grey's Universe
        </a>
        <div class="menu-links">
            <a href="index.html">Início</a>
            <a href="index.html#sobre">Sobre</a> <a href="index.html#historias">Histórias</a> <a href="index.html#historias">Histórias</a>

            <a href="index.html#musicas">Playlist</a>
            <a href="quiz.html">Quiz</a>
            <a href="dashboard.html">Dashboard</a>
            <span id="span_conta"></span>
        </div>
    </div>

    <div class="pagina-form">

        <div class="form-lateral">
            <h2>Bem-vindo de volta!</h2>
            <p>
                Entre na sua conta para continuar explorando o universo
                de Grey's Anatomy.
            </p>
            <p class="frase-escrita">"Você é a minha pessoa."</p>
        </div>

        <div class="form-conteudo">
            <h2>Entrar</h2>

            <div class="campo">
                <label>E-mail</label>
                <input type="text" id="ipt_email" placeholder="exemplo@email.com">
            </div>

            <div class="campo">
                <label>Senha</label>
                <input type="password" id="ipt_senha" placeholder="Digite sua senha">
            </div>

            <button class="botao-form" onclick="entrar()">Entrar</button>

            <div class="mensagem" id="div_exibir"></div>

            <p class="link-form">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>

    </div>

    <script>

        if (sessionStorage.ID_USUARIO != null) {
            let nomeCompleto = sessionStorage.NOME_USUARIO;
            let primeiroNome = "";
            let espacos = 0;

            for (let i = 0; i < nomeCompleto.length; i++) {
                if (nomeCompleto[i] == " ") {
                    espacos++;
                }
                if (espacos == 0) {
                    primeiroNome += nomeCompleto[i];
                }
            }

            span_conta.innerHTML = `<span class="ola-usuario">Olá, ${primeiroNome}</span>
                                    <a href="#" class="botao-entrar" onclick="sair()">Sair</a>`;
        } else {
            span_conta.innerHTML = `<a href="login.html" class="botao-entrar">Entrar</a>`;
        }

        function sair() {
            sessionStorage.clear();
            window.location = "index.html";
        }

        function entrar() {
            let email = ipt_email.value;
            let senha = ipt_senha.value;

            let campos = [email, senha];
            let camposVazios = 0;
            for (let i = 0; i < campos.length; i++) {
                if (campos[i] == "") {
                    camposVazios++;
                }
            }

            if (camposVazios > 0) {
                div_exibir.innerHTML = "Preencha o e-mail e a senha.";
            } else {

                let dadosLogin = {
                    emailServer: email,
                    senhaServer: senha
                };

                fetch("/usuarios/autenticar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dadosLogin)
                }).then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (usuario) {

                            sessionStorage.ID_USUARIO = usuario.idUsuario;
                            sessionStorage.NOME_USUARIO = usuario.nome;
                            sessionStorage.EMAIL_USUARIO = usuario.email;
                            sessionStorage.PERSONAGEM_USUARIO = usuario.fkPersonagem;

                            div_exibir.innerHTML = "Login realizado! Bem-vindo(a), " + usuario.nome + "!";

                            setTimeout(function () {
                                if (usuario.fkPersonagem == null) {
                                    window.location = "personagem.html";
                                } else {
                                    window.location = "index.html";
                                }
                            }, 1500);
                        });
                    } else {
                        div_exibir.innerHTML = "E-mail e/ou senha inválidos.";
                    }
                }).catch(function (erro) {
                    console.log(erro);
                    div_exibir.innerHTML = "Erro de conexão com o servidor.";
                });
            }
        }
    </script>

</body>

</html>
