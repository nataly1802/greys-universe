<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Grey's Universe</title>

    <!-- FONTES DO GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- MENU -->
    <div class="menu">
        <a href="index.html" class="logo">
            <svg class="logo-icone" viewBox="0 0 64 56">
                <circle cx="10" cy="5" r="2" />
                <circle cx="26" cy="5" r="2" />
                <path d="M10 7 C10 18 12 23 18 23 C24 23 26 18 26 7" />
                <path d="M18 23 V32 Q18 42 27 42 H32 L35 36 L39 50 L43 30 L47 42 H51" />
                <circle cx="56" cy="42" r="4.5" />
            </svg>
            Grey's Universe
        </a>
        <div class="menu-links">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="curiosidades.html">Curiosidades</a>
            <a href="index.html#musicas">Músicas</a>
            <a href="frases.html">Frases</a>
            <a href="quiz.html">Quiz</a>
            <a href="login.html" class="botao-entrar">Entrar</a>
        </div>
    </div>

    <!-- CAIXA DO LOGIN -->
    <div class="pagina-form">

        <!-- LADO ESQUERDO -->
        <div class="form-lateral">
            <h2>Bem-vindo de volta!</h2>
            <p>
                Entre na sua conta para continuar explorando o universo
                de Grey's Anatomy.
            </p>
            <p class="frase-escrita">"Você é a minha pessoa."</p>
        </div>

        <!-- LADO DIREITO: FORMULÁRIO -->
        <div class="form-conteudo">
            <h2>Entrar</h2>

            <div class="campo">
                <label>E-mail</label>
                <input type="text" id="ipt_email" placeholder="exemplo@email.com">
            </div>

            <div class="campo">
                <label>Senha</label>
                <input type="password" id="ipt_senha" placeholder="Digite sua senha">
            </div>

            <button class="botao-form" onclick="entrar()">Entrar</button>

            <div class="mensagem" id="div_exibir"></div>

            <p class="link-form">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>

    </div>

    <script>
        function entrar() {
            let email = ipt_email.value;
            let senha = ipt_senha.value;

            // VALIDAÇÃO: campos vazios (vetor + for + contador)
            let campos = [email, senha];
            let camposVazios = 0;
            for (let i = 0; i < campos.length; i++) {
                if (campos[i] == "") {
                    camposVazios++;
                }
            }

            if (camposVazios > 0) {
                div_exibir.innerHTML = "Preencha o e-mail e a senha.";
            } else {
                // objeto com os dados que vão para a API
                let dadosLogin = {
                    emailServer: email,
                    senhaServer: senha
                };

                fetch("/usuarios/autenticar", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(dadosLogin)
                }).then(function (resposta) {
                    if (resposta.ok) {
                        resposta.json().then(function (usuario) {
                            // guarda os dados do usuário logado
                            sessionStorage.ID_USUARIO = usuario.idUsuario;
                            sessionStorage.NOME_USUARIO = usuario.nome;
                            sessionStorage.EMAIL_USUARIO = usuario.email;
                            sessionStorage.PERSONAGEM_USUARIO = usuario.fkPersonagem;

                            div_exibir.innerHTML = "Login realizado! Bem-vindo(a), " + usuario.nome + "!";

                            setTimeout(function () {
                                if (usuario.fkPersonagem == null) {
                                    window.location = "personagem.html";
                                } else {
                                    window.location = "quiz.html";
                                }
                            }, 1500);
                        });
                    } else {
                        div_exibir.innerHTML = "E-mail e/ou senha inválidos.";
                    }
                }).catch(function (erro) {
                    console.log(erro);
                    div_exibir.innerHTML = "Erro de conexão com o servidor.";
                });
            }
        }
    </script>

</body>

</html>
